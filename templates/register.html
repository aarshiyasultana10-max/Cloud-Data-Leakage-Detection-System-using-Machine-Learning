<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLP Shield — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0c10;--surface:#111318;--surface2:#1a1d24;--border:#2a2d35;--accent:#00ff88;--text:#e8eaf0;--muted:#6b7280;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
        .glow{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,136,.05) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
        .wrap{position:relative;z-index:10;width:100%;max-width:420px;padding:0 20px;}
        .brand{text-align:center;margin-bottom:28px;}
        .shield{width:44px;height:44px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);margin:0 auto 12px;}
        .brand h1{font-size:1.4rem;font-weight:800;}
        .brand p{color:var(--muted);font-size:.66rem;font-family:'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;}
        label{display:block;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-family:'Space Mono',monospace;}
        input[type=text],input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 13px;font-family:'Syne',sans-serif;font-size:.86rem;outline:none;transition:border-color .2s;margin-bottom:14px;}
        input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,255,136,.08);}
        input::placeholder{color:var(--muted);}
        .strength-bar{height:4px;border-radius:2px;background:var(--surface2);margin-bottom:14px;overflow:hidden;}
        .strength-fill{height:100%;border-radius:2px;transition:all .3s;width:0;}
        .strength-label{font-size:.66rem;font-family:'Space Mono',monospace;color:var(--muted);margin-bottom:10px;}
        .role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;}
        .role-option input{display:none;}
        .role-option label{display:block;padding:8px 4px;border:1px solid var(--border);border-radius:8px;text-align:center;font-size:.7rem;font-weight:700;cursor:pointer;transition:all .15s;color:var(--muted);font-family:'Space Mono',monospace;margin:0;}
        .role-option input:checked+label{border-color:var(--accent);color:var(--accent);background:rgba(0,255,136,.08);}
        .btn{width:100%;background:var(--accent);color:#000;border:none;padding:12px;border-radius:8px;font-weight:800;font-size:.86rem;cursor:pointer;transition:all .15s;font-family:'Syne',sans-serif;}
        .btn:hover{background:#00cc6e;transform:translateY(-1px);}
        .error{background:rgba(255,59,92,.08);border:1px solid rgba(255,59,92,.3);border-radius:8px;padding:10px 14px;color:#ff6b84;font-size:.8rem;margin-bottom:14px;}
        .link{text-align:center;margin-top:14px;font-size:.8rem;color:var(--muted);}
        .link a{color:var(--accent);text-decoration:none;font-weight:600;}
        .scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,.01) 2px,rgba(0,255,136,.01) 4px);pointer-events:none;}
        .requirements{font-size:.66rem;font-family:'Space Mono',monospace;color:var(--muted);line-height:1.8;background:var(--surface2);border-radius:6px;padding:8px 10px;margin-bottom:14px;}
        .req{display:flex;align-items:center;gap:6px;}
        .req.ok{color:var(--accent);}
        .req.fail{color:var(--muted);}
    </style>
</head>
<body>
<div class="bg-grid"></div><div class="glow"></div><div class="scanline"></div>
<div class="wrap">
    <div class="brand"><div class="shield"></div><h1>Create Account</h1><p>DLP Shield System</p></div>
    <div class="card">
        {% if error %}<div class="error">⚠ {{ error }}</div>{% endif %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" autocomplete="off" required>
            <label>Password</label>
            <input type="password" name="password" id="pwInput" placeholder="Min 8 chars, 1 uppercase, 1 number" required>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-label" id="strengthLabel">Enter a password</div>
            <div class="requirements">
                <div class="req" id="req-len">○ At least 8 characters</div>
                <div class="req" id="req-upper">○ One uppercase letter</div>
                <div class="req" id="req-num">○ One number</div>
            </div>
            <label>Select Role</label>
            <div class="role-grid">
                <div class="role-option"><input type="radio" name="role" id="r1" value="User" checked><label for="r1">User</label></div>
                <div class="role-option"><input type="radio" name="role" id="r2" value="TPA"><label for="r2">TPA</label></div>
                <div class="role-option"><input type="radio" name="role" id="r3" value="Cloud"><label for="r3">Cloud</label></div>
            </div>
            <button class="btn" type="submit">Create Account →</button>
        </form>
    </div>
    <div class="link">Already have an account? <a href="/">Sign in</a></div>
</div>
<script>
const pw = document.getElementById('pwInput');
const fill = document.getElementById('strengthFill');
const lbl = document.getElementById('strengthLabel');
pw.addEventListener('input', () => {
    const v = pw.value;
    const hasLen = v.length >= 8, hasUpper = /[A-Z]/.test(v), hasNum = /[0-9]/.test(v);
    document.getElementById('req-len').className = 'req ' + (hasLen?'ok':'fail');
    document.getElementById('req-len').textContent = (hasLen?'✓':'○') + ' At least 8 characters';
    document.getElementById('req-upper').className = 'req ' + (hasUpper?'ok':'fail');
    document.getElementById('req-upper').textContent = (hasUpper?'✓':'○') + ' One uppercase letter';
    document.getElementById('req-num').className = 'req ' + (hasNum?'ok':'fail');
    document.getElementById('req-num').textContent = (hasNum?'✓':'○') + ' One number';
    const score = [hasLen, hasUpper, hasNum].filter(Boolean).length;
    const pct = (score/3)*100;
    fill.style.width = pct + '%';
    fill.style.background = score===3?'#00ff88':score===2?'#f59e0b':'#ff3b5c';
    lbl.textContent = score===3?'Strong password':score===2?'Medium strength':'Weak password';
    lbl.style.color = score===3?'#00ff88':score===2?'#fbbf24':'#ff6b84';
});
</script>
</body>
</html>
